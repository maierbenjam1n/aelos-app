name: aelos
description: Aelos instrument climate sensor app and web portal (hackathon demo).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.8

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.5.2
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  file_picker: ^13.1.0
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2
  flutter_blue_plus: ^2.3.14
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.4
  lottie: ^3.6.1
  pdf: ^3.13.1
  share_plus: ^13.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/seed/
    - assets/photos/

  # Static latin subsets from Fontsource (OFL-1.1, see assets/fonts/OFL-*.txt).
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-400.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-400-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-500-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
